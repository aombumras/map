<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realistic 3D Campus Diorama - Black Edges</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', Tahoma, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #f0f4f8; touch-action: none; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* เลเยอร์ของป้าย */
        #css2d-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        #css2d-container > div { pointer-events: none; }
        
        /* ป้ายชื่อตึก */
        .building-label {
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            padding: 6px 14px;
            border: 2px solid #38bdf8;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            pointer-events: auto; /* ให้ป้ายกดได้ */
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
        }
        .building-label::after {
            content: ''; position: absolute; bottom: -8px; left: 50%;
            border-width: 8px 6px 0; border-style: solid;
            border-color: #38bdf8 transparent transparent transparent;
            transform: translateX(-50%);
        }
        .building-label:active { transform: scale(0.9); }

        /* UI คอนโทรล */
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; padding: 20px; }
        
        .header-panel {
            background: rgba(255, 255, 255, 0.95); border-left: 5px solid #38bdf8;
            padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            pointer-events: auto; display: inline-block;
        }
        .header-panel h1 { font-size: 18px; color: #0f172a; margin: 0; font-weight: bold; }

        /* กล่องข้อมูล (Info Card) */
        .info-card {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(50px);
            background: #ffffff; border-top: 4px solid #38bdf8;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 20; width: 90%; max-width: 320px;
            opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }
        .info-card.active { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        
        .card-content { padding: 20px; }
        .card-content h3 { font-size: 18px; color: #0f172a; margin-bottom: 8px; font-weight: bold; }
        .card-content p { font-size: 14px; color: #475569; line-height: 1.5; margin-bottom: 15px; }
        
        .close-btn {
            background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; width: 100%;
            padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .close-btn:active { background: #e2e8f0; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="canvas-container"></div>
    <div id="css2d-container"></div>

    <div class="ui-overlay">
        <div class="header-panel">
            <h1>📍 แผนที่วิทยาเขต</h1>
        </div>
    </div>

    <div class="info-card" id="infoCard">
        <div class="card-content">
            <h3 id="cardTitle">ชื่อสถานที่</h3>
            <p id="cardDesc">รายละเอียด</p>
            <button class="close-btn" onclick="closeCard()">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        let scene, camera, renderer, labelRenderer, controls;
        let interactableObjects = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        const mapData = [
            { id: 1, name: "ตึก ECC", desc: "อาคารเรียนรวม ศูนย์ปฏิบัติการวิศวกรรม", color: 0x3b82f6, x: -4, z: -2, w: 3, h: 4.5, d: 2.5 },
            { id: 2, name: "KMUIDS", desc: "โรงเรียนสาธิตนานาชาติ", color: 0xf59e0b, x: 2, z: -5, w: 3.5, h: 2.5, d: 3 },
            { id: 3, name: "คณะแพทย์", desc: "คณะแพทยศาสตร์และเทคโนโลยีสุขภาพ", color: 0x10b981, x: -1.5, z: -6, w: 2.5, h: 3.5, d: 2 },
            { id: 4, name: "ตึกอธิการ", desc: "สำนักงานอธิการบดี", color: 0x8b5cf6, x: 6, z: -4, w: 3, h: 3, d: 2.5 },
            { id: 5, name: "โรงอาหาร B", desc: "ศูนย์อาหารนักศึกษา", color: 0xef4444, x: -4, z: 4, w: 2.5, h: 1.5, d: 2.5 },
            { id: 6, name: "หอนักศึกษา", desc: "หอพักนักศึกษา (ดีไซน์พิเศษ)", color: 0x06b6d4, x: -8, z: -1.5, w: 2.5, h: 5.5, d: 3 },
            { id: 7, name: "สถานีรถไฟ", desc: "สถานีรถไฟขนส่งมวลชน", color: 0x64748b, x: 0, z: 2.5, w: 8, h: 1, d: 1.5 }
        ];

        // ฟังก์ชันวาดเส้นขอบสีดำ
        function addBlackEdges(mesh) {
            const edges = new THREE.EdgesGeometry(mesh.geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
            mesh.add(line);
        }

        function init() {
            const webglContainer = document.getElementById('canvas-container');
            const css2dContainer = document.getElementById('css2d-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f4f8);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 22, 28);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            webglContainer.appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            css2dContainer.appendChild(labelRenderer.domElement);

            // Controls ผูกกับ renderer หลัก (จิ้มหมุนได้ทุกจุด)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.1; 
            controls.minDistance = 10;
            controls.maxDistance = 60;
            controls.target.set(0, 0, 0);

            // แสงสว่าง
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
            dirLight.position.set(15, 30, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            createBaseAndBorder();
            
            // สร้างอาคาร
            mapData.forEach(data => {
                if (data.name === "หอนักศึกษา") {
                    createDormitoryBuilding(data); // สร้างหอพักตามโค้ดตัวอย่างที่ให้มา
                } else {
                    createDetailedBuilding(data);  // สร้างอาคารปกติ
                }
            });

            window.addEventListener('resize', onWindowResize);
            // ให้กดตึกได้
            renderer.domElement.addEventListener('pointerdown', onDocumentClick);

            animate();
        }

        function createBaseAndBorder() {
            // พื้นหลัก
            const groundGeo = new THREE.PlaneGeometry(28, 20);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xecfdf5, roughness: 1 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // กรอบแผนที่ (Border)
            const borderMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
            const thickness = 0.5; const height = 1;

            const borders = [
                { w: 28 + thickness*2, d: thickness, x: 0, z: -10 - thickness/2 },
                { w: 28 + thickness*2, d: thickness, x: 0, z: 10 + thickness/2 },
                { w: thickness, d: 20, x: -14 - thickness/2, z: 0 },
                { w: thickness, d: 20, x: 14 + thickness/2, z: 0 }
            ];

            borders.forEach(b => {
                const bMesh = new THREE.Mesh(new THREE.BoxGeometry(b.w, height, b.d), borderMat);
                bMesh.position.set(b.x, height/2 - 0.1, b.z);
                addBlackEdges(bMesh); // ตีเส้นขอบกรอบ
                scene.add(bMesh);
            });
        }

        // ==========================================
        // ฟังก์ชันสร้างหอนักศึกษาแบบ C-Shape (จากโค้ดอ้างอิงของคุณ)
        // ==========================================
        function createDormitoryBuilding(data) {
            const group = new THREE.Group();
            
            const floorHeight = 4.5;
            const totalFloors = 6;
            
            const createBuildingShape = (offset = 0) => {
                const shape = new THREE.Shape();
                const w = 40 + offset;
                const d = 30 + offset;
                
                shape.moveTo(-w, d);
                shape.lineTo(w, d);
                shape.lineTo(w, -d/3);
                shape.quadraticCurveTo(0, -d*2.5 - offset, -w, -d/3);
                shape.lineTo(-w, d);

                const hole = new THREE.Path();
                hole.moveTo(-15, 12);
                hole.lineTo(15, 12);
                hole.lineTo(15, -6);
                hole.lineTo(-15, -6);
                hole.lineTo(-15, 12);
                shape.holes.push(hole);

                return shape;
            };

            const shapeSlab = createBuildingShape(0);
            const shapeGlass = createBuildingShape(-1.0);

            const extrudeSettingsSlab = { depth: 1.2, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.15, bevelThickness: 0.15 };
            const extrudeSettingsGlass = { depth: floorHeight - 1.2, bevelEnabled: false, steps: 1 };

            const geoSlab = new THREE.ExtrudeGeometry(shapeSlab, extrudeSettingsSlab);
            const geoGlass = new THREE.ExtrudeGeometry(shapeGlass, extrudeSettingsGlass);

            geoSlab.rotateX(Math.PI / 2);
            geoGlass.rotateX(Math.PI / 2);

            const matWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const matGlass = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.5 });
            const matPillar = new THREE.MeshStandardMaterial({ color: 0xd97706 });

            for (let i = 0; i < totalFloors; i++) {
                const floorGroup = new THREE.Group();
                
                const slab = new THREE.Mesh(geoSlab, matWhite);
                slab.position.y = 1.2; 
                addBlackEdges(slab); // ตีขอบดำ
                floorGroup.add(slab);

                if (i > 0) {
                    const glass = new THREE.Mesh(geoGlass, matGlass);
                    glass.position.y = floorHeight; 
                    addBlackEdges(glass); // ตีขอบดำ
                    floorGroup.add(glass);
                } else {
                    const pillarGeo = new THREE.CylinderGeometry(1.4, 1.4, floorHeight - 1.2, 16);
                    const pillarPositions = [ [-30, -20], [-18, -28], [0, -32], [18, -28], [30, -20], [-25, 0], [25, 0], [-15, 20], [15, 20], [0, 25] ];
                    pillarPositions.forEach(pos => {
                        const pillar = new THREE.Mesh(pillarGeo, matPillar);
                        pillar.position.set(pos[0], (floorHeight-1.2)/2 + 1.2, pos[1]);
                        addBlackEdges(pillar);
                        floorGroup.add(pillar);
                    });

                    const core = new THREE.Mesh(new THREE.BoxGeometry(40, floorHeight - 1.2, 25), matWhite);
                    core.position.set(0, (floorHeight-1.2)/2 + 1.2, 10);
                    addBlackEdges(core);
                    floorGroup.add(core);
                }

                floorGroup.position.y = i * floorHeight;
                group.add(floorGroup);
            }

            // หลังคา
            const roof = new THREE.Mesh(new THREE.BoxGeometry(30, 4, 15), matWhite);
            roof.position.set(0, totalFloors * floorHeight + 2, 5);
            addBlackEdges(roof);
            group.add(roof);

            // ย่อส่วนตึกให้เข้ากับแผนที่ของเรา (Scale Down)
            group.scale.set(0.04, 0.04, 0.04);
            group.position.set(data.x, 0, data.z);
            group.rotation.y = Math.PI / 4; // หันมุมนิดหน่อยให้สวย
            scene.add(group);

            // Hitbox สำหรับการกด
            const hitbox = new THREE.Mesh(new THREE.BoxGeometry(3, data.h, 3), new THREE.MeshBasicMaterial({ visible: false }));
            hitbox.position.set(data.x, data.h/2, data.z);
            hitbox.userData = data;
            scene.add(hitbox);
            interactableObjects.push(hitbox);

            createLabelObject(data, group.position, data.h + 0.5);
        }

        // ==========================================
        // ฟังก์ชันสร้างตึกปกติ
        // ==========================================
        function createDetailedBuilding(data) {
            const group = new THREE.Group();
            
            const floorHeight = 0.6;
            const floorCount = Math.max(1, Math.floor(data.h / floorHeight));

            const baseMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.5 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0xbae6fd });
            const concreteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

            for (let i = 0; i < floorCount; i++) {
                const yPos = (i * floorHeight) + (floorHeight / 2);

                const slab = new THREE.Mesh(new THREE.BoxGeometry(data.w + 0.1, 0.05, data.d + 0.1), concreteMat);
                slab.position.y = (i * floorHeight);
                addBlackEdges(slab); // ขอบดำ
                group.add(slab);

                const room = new THREE.Mesh(new THREE.BoxGeometry(data.w * 0.95, floorHeight - 0.05, data.d * 0.95), baseMat);
                room.position.y = yPos;
                addBlackEdges(room); // ขอบดำ
                group.add(room);

                const windows = new THREE.Mesh(new THREE.BoxGeometry(data.w * 0.98, floorHeight * 0.7, data.d * 0.98), glassMat);
                windows.position.y = yPos;
                addBlackEdges(windows); // ขอบดำ
                group.add(windows);
            }

            const roof = new THREE.Mesh(new THREE.BoxGeometry(data.w + 0.1, 0.1, data.d + 0.1), concreteMat);
            roof.position.y = floorCount * floorHeight;
            addBlackEdges(roof); // ขอบดำ
            group.add(roof);

            const hitbox = new THREE.Mesh(new THREE.BoxGeometry(data.w + 0.2, data.h, data.d + 0.2), new THREE.MeshBasicMaterial({ visible: false }));
            hitbox.position.y = data.h / 2;
            hitbox.userData = data;
            group.add(hitbox);
            interactableObjects.push(hitbox);

            group.position.set(data.x, 0, data.z);
            scene.add(group);

            createLabelObject(data, group.position, data.h + 0.8);
        }

        // ==========================================
        // ป้ายชื่อตึก
        // ==========================================
        function createLabelObject(data, position, heightOffset) {
            const div = document.createElement('div');
            div.className = 'building-label';
            div.textContent = data.name;
            div.style.pointerEvents = 'auto';
            
            div.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                showCard(data);
                controls.target.copy(position);
            });

            const labelObj = new CSS2DObject(div);
            labelObj.position.set(position.x, heightOffset, position.z);
            scene.add(labelObj);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactableObjects);

            if (intersects.length > 0) {
                const selected = intersects[0].object;
                showCard(selected.userData);
                
                // หาแกน X, Z ของตึกที่ถูกคลิก
                let targetPos = new THREE.Vector3();
                selected.getWorldPosition(targetPos);
                targetPos.y = 0;
                controls.target.copy(targetPos);
            } else {
                closeCard();
            }
        }

        window.showCard = function(data) {
            document.getElementById('cardTitle').innerText = data.name;
            document.getElementById('cardDesc').innerText = data.desc;
            document.getElementById('infoCard').classList.add('active');
        }

        window.closeCard = function() {
            document.getElementById('infoCard').classList.remove('active');
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
