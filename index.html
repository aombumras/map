
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Interactive 3D Campus Map</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Overlay */
        .ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .header-panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            pointer-events: auto;
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-panel h1 { font-size: 16px; color: #333; font-weight: bold; }
        .header-panel p { font-size: 12px; color: #666; }

        .footer-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            pointer-events: auto;
            padding-bottom: 20px;
        }

        .btn {
            background: #ffffff;
            color: #333;
            border: none;
            padding: 12px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: #007AFF; color: white; }

        /* Info Card Popup */
        .info-card {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: white;
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 20;
            width: 90%;
            max-width: 320px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .info-card.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .info-card h3 { font-size: 16px; color: #1a1a1a; margin-bottom: 5px; }
        .info-card p { font-size: 13px; color: #666; margin-bottom: 12px; }
        .info-card button {
            background: #ff3b30; color: white; border: none; padding: 6px 12px;
            border-radius: 8px; font-size: 12px; cursor: pointer; float: right;
        }

        /* Loading Screen */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #f5f5f7; z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #ddd; border-top: 4px solid #007AFF;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="font-size: 14px; color: #555;">กำลังโหลดแผนที่ 3D...</p>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="header-panel">
            <div>
                <h1>🗺️ 3D Campus Map</h1>
                <p>แตะที่ตึกเพื่อดูข้อมูล / ใช้สองนิ้วหมุนและซูม</p>
            </div>
        </div>

        <div class="footer-controls">
            <button class="btn" onclick="resetCamera()">🏠 หน้าแรก</button>
            <button class="btn btn-primary" onclick="toggleViewMode()">🔄 สลับมุมมอง</button>
        </div>
    </div>

    <div class="info-card" id="infoCard">
        <h3 id="cardTitle">ชื่ออาคาร</h3>
        <p id="cardDesc">รายละเอียดอาคารและจุดสำคัญในบริเวณนี้</p>
        <button onclick="closeCard()">ปิด</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let buildings = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let isStreetView = false;

        const buildingData = [
            { name: "ตึก ECC", desc: "จุดหมายหลัก ตึกศูนย์การเรียนรู้และกิจกรรมนักศึกษา", color: 0xff3b30, x: -2, z: -1, w: 2.5, h: 2, d: 2 },
            { name: "KMUIDS", desc: "อาคารเรียนและนวัตกรรมการเรียนรู้", color: 0x34c759, x: 1, z: -4, w: 2.5, h: 1.5, d: 2 },
            { name: "คณะแพทย์", desc: "อาคารคณะแพทยศาสตร์และบริการสุขภาพ", color: 0x5856d6, x: -1.5, z: -4, w: 2, h: 1.8, d: 1.5 },
            { name: "ตึกอธิการ", desc: "สำนักงานอธิการบดีและบริหารจัดการ", color: 0xff9500, x: 3.5, z: -4, w: 2.5, h: 2.2, d: 1.8 },
            { name: "โรงอาหาร B", desc: "ศูนย์อาหารและร้านค้าสวัสดิการ", color: 0xaf52de, x: -2, z: 4, w: 2, h: 1, d: 1.5 },
            { name: "หอนักศึกษา", desc: "หอพักอาคารที่พักอาศัยนักศึกษา", color: 0x007aff, x: -5, z: -1, w: 1.8, h: 2.5, d: 3 }
        ];

        function init() {
            const container = document.getElementById('canvas-container');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f2f5);
            scene.fog = new THREE.FogExp2(0xf0f2f5, 0.03);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 14, 12);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground
            controls.minDistance = 5;
            controls.maxDistance = 25;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Ground
            const groundGeo = new THREE.PlaneGeometry(30, 30);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xe5e5ea, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Train Track & Train Simulation
            createTrainSystem();

            // Create Buildings
            buildingData.forEach(data => {
                createBuilding(data);
            });

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onDocumentTouchClick);

            // Remove Loader
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
            }, 600);

            animate();
        }

        function createBuilding(data) {
            const geometry = new THREE.BoxGeometry(data.w, data.h, data.d);
            const material = new THREE.MeshStandardMaterial({ 
                color: data.color, 
                roughness: 0.3,
                metalness: 0.1 
            });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(data.x, data.h / 2, data.z);
            cube.castShadow = true;
            cube.receiveShadow = true;
            cube.userData = { name: data.name, desc: data.desc };
            
            scene.add(cube);
            buildings.push(cube);

            // Simple 3D Label simulation using canvas texture or basic wireframe can be enhanced, 
            // here we rely on interactive click selection for clean mobile UX.
        }

        function createTrainSystem() {
            // Railway
            const railGeo = new THREE.BoxGeometry(16, 0.1, 0.6);
            const railMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const rail = new THREE.Mesh(railGeo, railMat);
            rail.position.set(0, 0.05, 1.5);
            scene.add(rail);

            // Train cars
            for(let i = -2; i <= 2; i++) {
                const carGeo = new THREE.BoxGeometry(2.2, 0.8, 1);
                const carMat = new THREE.MeshStandardMaterial({ color: 0x5856d6 });
                const car = new THREE.Mesh(carGeo, carMat);
                car.position.set(i * 2.5, 0.45, 1.5);
                scene.add(car);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentTouchClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(buildings);

            if (intersects.length > 0) {
                const selectedBuilding = intersects[0].object;
                showCard(selectedBuilding.userData.name, selectedBuilding.userData.desc);
                
                // Smooth focus on building
                controls.target.copy(selectedBuilding.position);
            }
        }

        function showCard(title, desc) {
            document.getElementById('cardTitle').innerText = title;
            document.getElementById('cardDesc').innerText = desc;
            document.getElementById('infoCard').classList.add('active');
        }

        function closeCard() {
            document.getElementById('infoCard').classList.remove('active');
        }

        function resetCamera() {
            closeCard();
            isStreetView = false;
            camera.position.set(0, 14, 12);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function toggleViewMode() {
            isStreetView = !isStreetView;
            closeCard();
            if (isStreetView) {
                // Move camera down to Street View level near ECC building
                camera.position.set(-2, 1.2, 1);
                controls.target.set(-2, 1.2, -1);
            } else {
                resetCamera();
            }
            controls.update();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
