<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realistic 3D Campus Diorama</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', Tahoma, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #f0f4f8; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; touch-action: none; }
        
        /* ป้ายชื่อตึก */
        .building-label {
            background: rgba(255, 255, 255, 0.9);
            color: #1e293b;
            padding: 6px 14px;
            border: 2px solid #38bdf8;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            pointer-events: auto; /* ให้ป้ายกดได้ */
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
        }
        .building-label::after {
            content: ''; position: absolute; bottom: -8px; left: 50%;
            border-width: 8px 6px 0; border-style: solid;
            border-color: #38bdf8 transparent transparent transparent;
            transform: translateX(-50%);
        }
        .building-label:active { transform: scale(0.9); }

        /* UI คอนโทรล */
        .ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; padding: 20px;
        }

        .header-panel {
            background: rgba(255, 255, 255, 0.95); border-left: 5px solid #38bdf8;
            padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            pointer-events: auto; display: inline-block;
        }
        .header-panel h1 { font-size: 18px; color: #0f172a; margin: 0; font-weight: bold; }

        /* กล่องข้อมูล (Info Card) */
        .info-card {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(50px);
            background: #ffffff; border-top: 4px solid #38bdf8;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 20; width: 90%; max-width: 320px;
            opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }
        .info-card.active { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        
        .card-content { padding: 20px; }
        .card-content h3 { font-size: 18px; color: #0f172a; margin-bottom: 8px; font-weight: bold; }
        .card-content p { font-size: 14px; color: #475569; line-height: 1.5; margin-bottom: 15px; }
        
        .close-btn {
            background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; width: 100%;
            padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .close-btn:active { background: #e2e8f0; }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="header-panel">
            <h1>📍 แผนที่วิทยาเขต</h1>
        </div>
    </div>

    <!-- กล่องข้อความแสดงผล -->
    <div class="info-card" id="infoCard">
        <div class="card-content">
            <h3 id="cardTitle">ชื่อสถานที่</h3>
            <p id="cardDesc">รายละเอียด</p>
            <button class="close-btn" onclick="closeCard()">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>
        let scene, camera, renderer, labelRenderer, controls;
        let interactableObjects = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // ข้อมูลตึกพร้อมสีสัน
        const mapData = [
            { id: 1, name: "ตึก ECC", desc: "อาคารเรียนรวม ศูนย์ปฏิบัติการวิศวกรรม", color: 0x3b82f6, x: -4, z: -2, w: 3, h: 4.5, d: 2.5 },
            { id: 2, name: "KMUIDS", desc: "โรงเรียนสาธิตนานาชาติ", color: 0xf59e0b, x: 2, z: -5, w: 3.5, h: 2.5, d: 3 },
            { id: 3, name: "คณะแพทย์", desc: "คณะแพทยศาสตร์และเทคโนโลยีสุขภาพ", color: 0x10b981, x: -1.5, z: -6, w: 2.5, h: 3.5, d: 2 },
            { id: 4, name: "ตึกอธิการ", desc: "สำนักงานอธิการบดี", color: 0x8b5cf6, x: 6, z: -4, w: 3, h: 3, d: 2.5 },
            { id: 5, name: "โรงอาหาร B", desc: "ศูนย์อาหารนักศึกษา", color: 0xef4444, x: -4, z: 4, w: 2.5, h: 1.5, d: 2.5 },
            { id: 6, name: "หอนักศึกษา", desc: "หอพักในมหาวิทยาลัย", color: 0x06b6d4, x: -8, z: -1.5, w: 2.5, h: 5.5, d: 3 },
            { id: 7, name: "สถานีรถไฟ", desc: "สถานีรถไฟขนส่งมวลชน", color: 0x64748b, x: 0, z: 2.5, w: 8, h: 1, d: 1.5 }
        ];

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f4f8);
            
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 25);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            labelRenderer = new THREE.CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            // ป้องกันไม่ให้เลเยอร์ป้ายบล็อกการทัชหน้าจอ
            labelRenderer.domElement.style.pointerEvents = 'none'; 
            document.body.appendChild(labelRenderer.domElement);

            // ติดตั้ง Controls ไว้ที่ renderer 3D ทำให้จิ้มจุดไหนก็หมุนได้
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.1; 
            controls.minDistance = 10;
            controls.maxDistance = 45;

            // แสงสว่าง
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
            dirLight.position.set(15, 30, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            createBaseAndBorder();
            createEnvironment();
            
            // สร้างตึกที่มีรายละเอียดแบบชั้นๆ
            mapData.forEach(data => createDetailedBuilding(data));

            window.addEventListener('resize', onWindowResize);
            // ตรวจจับการคลิกที่ 3D Canvas
            renderer.domElement.addEventListener('pointerdown', onDocumentClick);

            animate();
        }

        function createBaseAndBorder() {
            // พื้นหลัก
            const groundGeo = new THREE.PlaneGeometry(28, 20);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xecfdf5, roughness: 1 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // กรอบแผนที่ (Border)
            const borderMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });
            const thickness = 0.5;
            const height = 1;

            const borders = [
                { w: 28 + thickness*2, d: thickness, x: 0, z: -10 - thickness/2 }, // กรอบบน
                { w: 28 + thickness*2, d: thickness, x: 0, z: 10 + thickness/2 },  // กรอบล่าง
                { w: thickness, d: 20, x: -14 - thickness/2, z: 0 },               // กรอบซ้าย
                { w: thickness, d: 20, x: 14 + thickness/2, z: 0 }                 // กรอบขวา
            ];

            borders.forEach(b => {
                const bGeo = new THREE.BoxGeometry(b.w, height, b.d);
                const bMesh = new THREE.Mesh(bGeo, borderMat);
                bMesh.position.set(b.x, height/2 - 0.1, b.z);
                bMesh.castShadow = true;
                bMesh.receiveShadow = true;
                scene.add(bMesh);
            });
        }

        function createEnvironment() {
            // ทางเดิน (Walkways)
            const pathMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const paths = [
                { w: 22, d: 1.5, x: -2, z: -1 }, { w: 14, d: 1.2, x: 0, z: -3.5 },
                { w: 1.5, d: 6, x: -2.5, z: 2 }, { w: 1.5, d: 4, x: 2, z: -2 },
                { w: 1.5, d: 5, x: 5, z: -1 }
            ];
            paths.forEach(p => {
                const pathMesh = new THREE.Mesh(new THREE.PlaneGeometry(p.w, p.d), pathMat);
                pathMesh.rotation.x = -Math.PI / 2;
                pathMesh.position.set(p.x, 0.02, p.z);
                pathMesh.receiveShadow = true;
                scene.add(pathMesh);
            });

            // ต้นไม้จำลอง
            const treeMat = new THREE.MeshStandardMaterial({ color: 0x10b981 });
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x78716c });
            const treePositions = [{x:-6,z:-3},{x:-5,z:-4},{x:3,z:-1},{x:7,z:-2},{x:1,z:3.5},{x:-1,z:4},{x:-5,z:2}];
            treePositions.forEach(pos => {
                const g = new THREE.Group();
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 4), treeMat);
                leaves.position.y = 0.6; leaves.castShadow = true;
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.3), trunkMat);
                trunk.position.y = 0.15; trunk.castShadow = true;
                g.add(leaves, trunk);
                g.position.set(pos.x, 0, pos.z);
                scene.add(g);
            });
        }

        function createDetailedBuilding(data) {
            const group = new THREE.Group();
            
            const floorHeight = 0.6;
            const floorCount = Math.max(1, Math.floor(data.h / floorHeight));

            const baseMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.5 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0xbae6fd, metalness: 0.5, roughness: 0.2 });
            const concreteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc });

            // สร้างเป็นชั้นๆ (Floors)
            for (let i = 0; i < floorCount; i++) {
                const yPos = (i * floorHeight) + (floorHeight / 2);

                // พื้น/เพดานของแต่ละชั้น
                const slab = new THREE.Mesh(new THREE.BoxGeometry(data.w + 0.1, 0.05, data.d + 0.1), concreteMat);
                slab.position.y = (i * floorHeight);
                slab.castShadow = true;
                group.add(slab);

                // บล็อกห้องที่มีสีประจำตึก
                const room = new THREE.Mesh(new THREE.BoxGeometry(data.w * 0.95, floorHeight - 0.05, data.d * 0.95), baseMat);
                room.position.y = yPos;
                room.castShadow = true;
                group.add(room);

                // กระจกหน้าต่างแปะรอบๆ ตึก
                const windowGeom = new THREE.BoxGeometry(data.w * 0.98, floorHeight * 0.7, data.d * 0.98);
                const windows = new THREE.Mesh(windowGeom, glassMat);
                windows.position.y = yPos;
                group.add(windows);

                // สร้างประตูทางเข้าเฉพาะชั้น 1 (ชั้นล่างสุด)
                if (i === 0) {
                    const door = new THREE.Mesh(new THREE.BoxGeometry(1, floorHeight * 0.8, data.d + 0.05), new THREE.MeshStandardMaterial({ color: 0x334155 }));
                    door.position.set(0, floorHeight * 0.4, 0);
                    group.add(door);
                }
            }

            // หลังคาตึก
            const roof = new THREE.Mesh(new THREE.BoxGeometry(data.w + 0.1, 0.1, data.d + 0.1), concreteMat);
            roof.position.y = floorCount * floorHeight;
            roof.castShadow = true;
            group.add(roof);

            // Hitbox จับการคลิก
            const hitbox = new THREE.Mesh(new THREE.BoxGeometry(data.w + 0.2, data.h, data.d + 0.2), new THREE.MeshBasicMaterial({ visible: false }));
            hitbox.position.y = data.h / 2;
            hitbox.userData = data;
            group.add(hitbox);
            interactableObjects.push(hitbox);

            group.position.set(data.x, 0, data.z);
            scene.add(group);

            // สร้างป้ายชื่อโฮโลแกรม
            const labelDiv = document.createElement('div');
            labelDiv.className = 'building-label';
            labelDiv.textContent = data.name;
            labelDiv.style.pointerEvents = 'auto'; // ให้ป้ายโดนคลิกได้อิสระจาก Canvas
            
            labelDiv.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                showCard(data);
                controls.target.copy(group.position);
            });

            const labelObj = new THREE.CSS2DObject(labelDiv);
            labelObj.position.set(0, data.h + 0.8, 0);
            group.add(labelObj);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentClick(event) {
            // รองรับการคลิก/จิ้มที่ตึกโดยตรง
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactableObjects);

            if (intersects.length > 0) {
                const selected = intersects[0].object;
                showCard(selected.userData);
                controls.target.copy(selected.parent.position);
            } else {
                closeCard(); // จิ้มพื้นว่างๆ เพื่อปิดหน้าต่าง
            }
        }

        function showCard(data) {
            document.getElementById('cardTitle').innerText = data.name;
            document.getElementById('cardDesc').innerText = data.desc;
            document.getElementById('infoCard').classList.add('active');
        }

        function closeCard() {
            document.getElementById('infoCard').classList.remove('active');
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
