<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Map - สถาบันบำราศนราดูร</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', Tahoma, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #e2e8f0; touch-action: none; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #css2d-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        #css2d-container > div { pointer-events: none; }
        
        /* ป้ายชื่อตึกหลัก */
        .building-label {
            background: rgba(255, 255, 255, 0.95); color: #0f172a;
            padding: 6px 14px; border: 2px solid #38bdf8; border-radius: 8px;
            font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            pointer-events: auto; cursor: pointer; transition: all 0.2s;
            text-align: center; white-space: nowrap;
        }
        .building-label::after {
            content: ''; position: absolute; bottom: -8px; left: 50%;
            border-width: 8px 6px 0; border-style: solid;
            border-color: #38bdf8 transparent transparent transparent; transform: translateX(-50%);
        }
        .building-label:active { transform: scale(0.9); }

        /* ป้ายบอกทางเดิน */
        .walkway-label {
            background: #fef08a; color: #854d0e; padding: 4px 10px;
            border: 2px solid #eab308; border-radius: 20px; font-size: 12px;
            font-weight: bold; pointer-events: none; box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        /* UI คอนโทรล */
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; padding: 20px; }
        
        .header-panel {
            background: rgba(255, 255, 255, 0.95); border-left: 5px solid #10b981;
            padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            pointer-events: auto; display: inline-block; max-width: 380px;
        }
        .header-panel h1 { font-size: 18px; color: #0f172a; margin: 0; font-weight: bold; }
        .header-panel p { font-size: 12px; color: #64748b; margin-top: 4px; line-height: 1.4; }

        /* กล่องข้อมูล (Info Card) */
        .info-card {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(50px);
            background: #ffffff; border-top: 4px solid #10b981;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 20; width: 90%; max-width: 320px;
            opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }
        .info-card.active { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        
        .card-content { padding: 20px; }
        .card-content h3 { font-size: 18px; color: #0f172a; margin-bottom: 8px; font-weight: bold; }
        .card-content p { font-size: 14px; color: #475569; line-height: 1.5; margin-bottom: 15px; }
        
        .close-btn {
            background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; width: 100%;
            padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .close-btn:active { background: #e2e8f0; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="canvas-container"></div>
    <div id="css2d-container"></div>

    <div class="ui-overlay">
        <div class="header-panel">
            <h1>📍 แผนผัง สถาบันบำราศนราดูร</h1>
            <p>กรุณานำรถจอดที่ลานจอดด้านหน้า และเดินตามเส้นทางสีเหลืองเพื่อเข้าสู่จุดคัดกรอง</p>
        </div>
    </div>

    <div class="info-card" id="infoCard">
        <div class="card-content">
            <h3 id="cardTitle">ชื่อสถานที่</h3>
            <p id="cardDesc">รายละเอียด</p>
            <button class="close-btn" onclick="closeCard()">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        let scene, camera, renderer, labelRenderer, controls;
        let interactableObjects = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // ข้อมูลพิกัดและอาคารของบำราศนราดูร
        const mapData = [
            { id: 1, name: "อาคารเฉลิมพระเกียรติ (OPD)", desc: "จุดคัดกรองและตรวจรักษาโรคทั่วไป (ผู้รับบริการเริ่มต้นที่นี่)", color: 0x10b981, x: -2, z: 2, w: 8, h: 4.5, d: 6 },
            { id: 2, name: "แผนกฉุกเฉิน (ER)", desc: "ศูนย์อุบัติเหตุและฉุกเฉิน สถาบันบำราศนราดูร (เปิดให้บริการตลอด 24 ชั่วโมง)", color: 0xef4444, x: -11, z: 3, w: 4.5, h: 2.5, d: 5 },
            { id: 3, name: "ศูนย์ไตเทียม", desc: "หน่วยฟอกเลือดด้วยเครื่องไตเทียม ที่ได้มาตรฐาน มีการตรวจสอบคุณภาพน้ำ (Water Sample Analysis) ทุกเดือนอย่างเคร่งครัด", color: 0x3b82f6, x: 9, z: -1, w: 6, h: 3, d: 5 },
            { id: 4, name: "อาคารผู้ป่วยใน (IPD)", desc: "หอพักผู้ป่วยใน และหอผู้ป่วยแยกโรคเฉพาะทาง", color: 0x6366f1, x: -2, z: -7, w: 9, h: 7, d: 6 },
            { id: 5, name: "อาคารอำนวยการ", desc: "ศูนย์บริหารงาน และศูนย์พัฒนาระบบคุณภาพ (CQI / PDCA)", color: 0xf59e0b, x: -11, z: -6, w: 5, h: 3.5, d: 5 },
            { id: 6, name: "จุดจอดรถผู้รับบริการ", desc: "ลานจอดรถสำหรับผู้ป่วยและญาติ กรุณาเดินตามเส้นทางสีเหลืองเพื่อเข้าสู่จุดคัดกรอง", color: 0x64748b, x: 9, z: 10, w: 12, h: 0.2, d: 6, isParking: true }
        ];

        // ฟังก์ชันวาดเส้นขอบสีดำ
        function addBlackEdges(mesh) {
            const edges = new THREE.EdgesGeometry(mesh.geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
            mesh.add(line);
        }

        function init() {
            const webglContainer = document.getElementById('canvas-container');
            const css2dContainer = document.getElementById('css2d-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe2e8f0);
            
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 28, 35);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            webglContainer.appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            css2dContainer.appendChild(labelRenderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.1; 
            controls.minDistance = 15;
            controls.maxDistance = 60;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.85);
            dirLight.position.set(20, 35, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            createBaseAndBorder();
            createPatientWalkway(); // สร้างทางเดินผู้รับบริการ
            createTrees();
            
            // สร้างกลุ่มอาคารและลานจอด
            mapData.forEach(data => {
                if (data.isParking) {
                    createParkingLot(data);
                } else {
                    createDetailedBuilding(data);
                }
            });

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onDocumentClick);

            animate();
        }

        function createBaseAndBorder() {
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(36, 28), new THREE.MeshStandardMaterial({ color: 0xf1f5f9 }));
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // ถนนหลักทางเข้า
            const road = new THREE.Mesh(new THREE.PlaneGeometry(36, 6), new THREE.MeshStandardMaterial({ color: 0x475569 }));
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, 0.01, 15);
            road.receiveShadow = true;
            scene.add(road);

            // กรอบ Diorama
            const borderMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            const thickness = 0.5; const height = 1.2;
            const borders = [
                { w: 36 + thickness*2, d: thickness, x: 0, z: -14 - thickness/2 },
                { w: 36 + thickness*2, d: thickness, x: 0, z: 14 + thickness/2 },
                { w: thickness, d: 28, x: -18 - thickness/2, z: 0 },
                { w: thickness, d: 28, x: 18 + thickness/2, z: 0 }
            ];

            borders.forEach(b => {
                const bMesh = new THREE.Mesh(new THREE.BoxGeometry(b.w, height, b.d), borderMat);
                bMesh.position.set(b.x, height/2 - 0.2, b.z);
                addBlackEdges(bMesh);
                scene.add(bMesh);
            });
        }

        // ==========================================
        // สร้างลานจอดรถผู้รับบริการ
        // ==========================================
        function createParkingLot(data) {
            const group = new THREE.Group();
            
            const parkMesh = new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h, data.d), new THREE.MeshStandardMaterial({ color: data.color }));
            parkMesh.position.y = data.h / 2;
            addBlackEdges(parkMesh);
            group.add(parkMesh);

            // ตีเส้นขาวช่องจอดรถ
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            for(let i=0; i<6; i++) {
                const line = new THREE.Mesh(new THREE.PlaneGeometry(0.2, data.d - 1.5), lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(-data.w/2 + 1.5 + (i*1.8), data.h + 0.01, 0);
                group.add(line);
            }
            
            const hitbox = new THREE.Mesh(new THREE.BoxGeometry(data.w, 2, data.d), new THREE.MeshBasicMaterial({ visible: false }));
            hitbox.position.y = 1;
            hitbox.userData = data;
            group.add(hitbox);
            interactableObjects.push(hitbox);

            group.position.set(data.x, 0, data.z);
            scene.add(group);

            createLabelObject(data, group.position, 1.5);
        }

        // ==========================================
        // สร้างทางเดินสีเหลืองเด่นชัด สำหรับคนไข้
        // ==========================================
        function createPatientWalkway() {
            const pathMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.4 });
            
            const paths = [
                { w: 6, d: 1.5, x: 2, z: 10 },    // ออกจากลานจอด
                { w: 1.5, d: 9, x: -1, z: 6 },    // ทางเดินตรงยาวเข้า OPD
                { w: 6, d: 1.5, x: -5.5, z: 3 },  // เลี้ยวซ้ายไป ER
                { w: 7, d: 1.5, x: 3, z: 2 },     // เลี้ยวขวาไปไตเทียม
                { w: 1.5, d: 3, x: 6, z: 0.5 },   // เข้าหน้าตึกไตเทียม
                { w: 1.5, d: 5, x: -1, z: -3 }    // ทะลุ OPD ไปตึก IPD ด้านหลัง
            ];

            paths.forEach(p => {
                const pathMesh = new THREE.Mesh(new THREE.PlaneGeometry(p.w, p.d), pathMat);
                pathMesh.rotation.x = -Math.PI / 2;
                pathMesh.position.set(p.x, 0.03, p.z);
                pathMesh.receiveShadow = true;
                scene.add(pathMesh);
            });

            // ป้ายบอกทางเดิน
            const pathLabelDiv = document.createElement('div');
            pathLabelDiv.className = 'walkway-label';
            pathLabelDiv.textContent = '🚶 เส้นทางผู้รับบริการ';
            const pathLabelObj = new CSS2DObject(pathLabelDiv);
            pathLabelObj.position.set(-1, 0.4, 7);
            scene.add(pathLabelObj);
        }

        // ==========================================
        // สร้างอาคาร 3D แบ่งชั้นสมจริง
        // ==========================================
        function createDetailedBuilding(data) {
            const group = new THREE.Group();
            
            const floorHeight = 0.8;
            const floorCount = Math.max(1, Math.floor(data.h / floorHeight));

            const baseMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.5 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0xe0f2fe });
            const concreteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

            for (let i = 0; i < floorCount; i++) {
                const yPos = (i * floorHeight) + (floorHeight / 2);

                const slab = new THREE.Mesh(new THREE.BoxGeometry(data.w + 0.2, 0.05, data.d + 0.2), concreteMat);
                slab.position.y = (i * floorHeight);
                addBlackEdges(slab); 
                group.add(slab);

                const room = new THREE.Mesh(new THREE.BoxGeometry(data.w * 0.95, floorHeight - 0.05, data.d * 0.95), baseMat);
                room.position.y = yPos;
                addBlackEdges(room); 
                group.add(room);

                const windows = new THREE.Mesh(new THREE.BoxGeometry(data.w * 0.98, floorHeight * 0.6, data.d * 0.98), glassMat);
                windows.position.y = yPos;
                addBlackEdges(windows); 
                group.add(windows);
            }

            const roof = new THREE.Mesh(new THREE.BoxGeometry(data.w + 0.2, 0.1, data.d + 0.2), concreteMat);
            roof.position.y = floorCount * floorHeight;
            addBlackEdges(roof); 
            group.add(roof);

            const hitbox = new THREE.Mesh(new THREE.BoxGeometry(data.w + 0.4, data.h, data.d + 0.4), new THREE.MeshBasicMaterial({ visible: false }));
            hitbox.position.y = data.h / 2;
            hitbox.userData = data;
            group.add(hitbox);
            interactableObjects.push(hitbox);

            group.position.set(data.x, 0, data.z);
            scene.add(group);

            createLabelObject(data, group.position, data.h + 1);
        }

        function createTrees() {
            const treeMat = new THREE.MeshStandardMaterial({ color: 0x22c55e });
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x78716c });
            const treePositions = [
                {x: -15, z: 10}, {x: -11, z: 11}, {x: -6, z: 8}, {x: 15, z: 10},
                {x: 16, z: 5}, {x: 15, z: -5}, {x: 5, z: -6}, {x: -8, z: -1}
            ];
            treePositions.forEach(pos => {
                const g = new THREE.Group();
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1, 5), treeMat);
                leaves.position.y = 0.7; leaves.castShadow = true;
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.4), trunkMat);
                trunk.position.y = 0.2; trunk.castShadow = true;
                g.add(leaves, trunk);
                g.position.set(pos.x, 0, pos.z);
                scene.add(g);
            });
        }

        function createLabelObject(data, position, heightOffset) {
            const div = document.createElement('div');
            div.className = 'building-label';
            div.textContent = data.name;
            div.style.pointerEvents = 'auto';
            
            div.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                showCard(data);
                
                let targetPos = new THREE.Vector3();
                targetPos.copy(position);
                targetPos.y = 0;
                controls.target.copy(targetPos);
            });

            const labelObj = new CSS2DObject(div);
            labelObj.position.set(position.x, heightOffset, position.z);
            scene.add(labelObj);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactableObjects);

            if (intersects.length > 0) {
                const selected = intersects[0].object;
                showCard(selected.userData);
                let targetPos = new THREE.Vector3();
                selected.getWorldPosition(targetPos);
                targetPos.y = 0;
                controls.target.copy(targetPos);
            } else {
                closeCard();
            }
        }

        window.showCard = function(data) {
            document.getElementById('cardTitle').innerText = data.name;
            document.getElementById('cardDesc').innerText = data.desc;
            document.getElementById('infoCard').classList.add('active');
        }

        window.closeCard = function() {
            document.getElementById('infoCard').classList.remove('active');
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
