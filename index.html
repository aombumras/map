<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Map - สถาบันบำราศนราดูร (Updated Layout)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', Tahoma, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #e2e8f0; touch-action: none; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #css2d-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        #css2d-container > div { pointer-events: none; }
        
        /* ป้ายชื่อตึก */
        .building-label {
            background: rgba(255, 255, 255, 0.95); color: #0f172a;
            padding: 4px 10px; border: 1.5px solid #000; border-radius: 4px;
            font-size: 12px; font-weight: bold; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            pointer-events: auto; cursor: pointer; transition: all 0.2s;
            text-align: center; white-space: nowrap;
        }
        .building-label:active { transform: scale(0.9); }

        /* ป้ายทางเข้า-ออก (สีแดง) */
        .gate-label {
            background: #ef4444; color: white; padding: 4px 12px;
            border: 2px solid #b91c1c; border-radius: 12px; font-size: 13px;
            font-weight: bold; pointer-events: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* UI คอนโทรล */
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; padding: 20px; }
        
        .header-panel {
            background: rgba(255, 255, 255, 0.95); border-left: 5px solid #333;
            padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            pointer-events: auto; display: inline-block; max-width: 400px;
        }
        .header-panel h1 { font-size: 18px; color: #111; margin: 0; font-weight: bold; }
        .header-panel p { font-size: 13px; color: #555; margin-top: 4px; line-height: 1.4; }

        /* กล่องข้อมูล (Info Card) */
        .info-card {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(50px);
            background: #ffffff; border-top: 4px solid #111;
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 20; width: 90%; max-width: 320px;
            opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }
        .info-card.active { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .card-content { padding: 20px; }
        .card-content h3 { font-size: 18px; color: #111; margin-bottom: 8px; font-weight: bold; }
        .card-content p { font-size: 14px; color: #444; line-height: 1.5; margin-bottom: 15px; }
        .close-btn {
            background: #f1f5f9; color: #111; border: 1px solid #ccc; width: 100%;
            padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .close-btn:active { background: #e2e8f0; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="canvas-container"></div>
    <div id="css2d-container"></div>

    <div class="ui-overlay">
        <div class="header-panel">
            <h1>แผนผังแสดงอาคาร สถาบันบำราศนราดูร</h1>
            <p>หมุนและซูมเพื่อดูรายละเอียดอาคาร เส้นทางรถ ประตูเข้า-ออก และลูกศรจราจร</p>
        </div>
    </div>

    <div class="info-card" id="infoCard">
        <div class="card-content">
            <h3 id="cardTitle">ชื่อสถานที่</h3>
            <p id="cardDesc">รายละเอียด</p>
            <button class="close-btn" onclick="closeCard()">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        let scene, camera, renderer, labelRenderer, controls;
        let interactableObjects = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // ----------------------------------------------------
        // ข้อมูลอาคาร (อัปเดตความสูงและตำแหน่งตามคำสั่งล่าสุด)
        // ----------------------------------------------------
        const mapData = [
            // อาคารเฉลิมพระเกียรติ พอดีกับตึก 2 และ 3 (ระยะ x:-12 ถึง 2) -> Center -5, Width 14
            { name: "อาคารเฉลิมพระเกียรติ", desc: "อาคารหลักด้านหน้า", x: -5, z: 9, w: 14, h: 4, d: 5 },
            
            { name: "ตึก 1", desc: "อาคารตึก 1 (2 ชั้น)", x: 8.5, z: 9, w: 5, h: 2, d: 5 }, // 2 ชั้น
            { name: "ตึก 2", desc: "อาคารผู้ป่วย (4 ชั้น)", x: -9, z: 2.5, w: 6, h: 4, d: 5 },
            { name: "ตึก 3", desc: "อาคารผู้ป่วย (5 ชั้น)", x: -1, z: 2.5, w: 6, h: 5, d: 5 }, // 5 ชั้น
            { name: "ตึก 4", desc: "อาคารผู้ป่วย (4 ชั้น)", x: 7, z: 2.5, w: 6, h: 4, d: 5 },
            
            { name: "ตึก 8", desc: "อาคารผู้ป่วย (4 ชั้น)", x: -9, z: -4, w: 6, h: 4, d: 5 },
            { name: "ตึก 7", desc: "อาคารผู้ป่วย (6 ชั้น)", x: -1, z: -4, w: 6, h: 6, d: 5 }, // 6 ชั้น
            { name: "ตึก 5", desc: "อาคารผู้ป่วย (5 ชั้น)", x: 7, z: -4, w: 6, h: 5, d: 5 }, // 5 ชั้น
            
            { name: "อาคาร 10 ชั้น", desc: "อาคารสูง 10 ชั้น", x: -16, z: 2.5, w: 4, h: 10, d: 5 },
            // วิทยาลัยพยาบาลถูกลบออกตามคำสั่ง
            
            { name: "แฟลต", desc: "ที่พักบุคลากร", x: -16, z: -4, w: 4, h: 5, d: 4 },
            { name: "หอประชุมอัจฉรา", desc: "หอประชุมและโรงอาหาร (พอดีกับตึก 8)", x: -9, z: -11, w: 6, h: 3, d: 5 }, // พอดีตึก 8 (กว้าง 6, x=-9)
            
            { name: "อาคารชันสูตร", desc: "ศูนย์ชันสูตรโรค", x: -22, z: -10, w: 5, h: 3, d: 4 },
            { name: "กำจัดขยะ", desc: "ศูนย์กำจัดขยะติดเชื้อ", x: -16.5, z: -10, w: 4, h: 2, d: 4 },
            { name: "บำบัดน้ำเสีย", desc: "ระบบบำบัดน้ำเสีย", x: -20, z: -16, w: 8, h: 2, d: 4, isBlue: true },
            { name: "ยานพาหนะ", desc: "ศูนย์ยานพาหนะ", x: -12.5, z: -17, w: 6, h: 2, d: 3 },
            
            // แฟลต 1-4 เรียงกัน ขอบเท่ากันพอดีเป๊ะ (กว้าง 6 ห่าง 0.5)
            { name: "แฟลต 1", desc: "ที่พักบุคลากร 1", x: -4.5, z: -17, w: 6, h: 5, d: 3 },
            { name: "แฟลต 2", desc: "ที่พักบุคลากร 2", x: 2.0, z: -17, w: 6, h: 5, d: 3 },
            { name: "แฟลต 3", desc: "ที่พักบุคลากร 3", x: 8.5, z: -17, w: 6, h: 5, d: 3 },
            { name: "แฟลต 4", desc: "ที่พักบุคลากร 4", x: 15.0, z: -17, w: 6, h: 5, d: 3 },
            
            // แฟลต 5-6 อยู่ล่างแฟลต 3-4
            { name: "แฟลต 5", desc: "ที่พักบุคลากร 5", x: 8.5, z: -11, w: 6, h: 5, d: 3 },
            { name: "แฟลต 6", desc: "ที่พักบุคลากร 6", x: 15.0, z: -11, w: 6, h: 5, d: 3 },
            
            { name: "อาคารกีฬา", desc: "ลานกีฬาและนันทนาการ (1 ชั้น)", x: 23, z: -1, w: 7, h: 1, d: 11 }, // 1 ชั้น
            { name: "แฟลตแพทย์", desc: "ที่พักแพทย์", x: 18, z: 9, w: 5, h: 5, d: 3 }
        ];

        // ฟังก์ชันตีเส้นดำให้อาคารมีมิติ
        function addBlackEdges(mesh) {
            const edges = new THREE.EdgesGeometry(mesh.geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
            mesh.add(line);
        }

        function init() {
            const webglContainer = document.getElementById('canvas-container');
            const css2dContainer = document.getElementById('css2d-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc); // พื้นสีขาวสว่าง
            
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 45, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            webglContainer.appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            css2dContainer.appendChild(labelRenderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.1; 
            controls.target.set(0, 0, 0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            createGroundAndRoads();
            createTrafficArrows();
            createEnvironment();
            
            // วาดตึก
            mapData.forEach(data => createWhiteBuilding(data));

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onDocumentClick);

            animate();
        }

        function createGroundAndRoads() {
            // พื้นหลัก
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(65, 45), new THREE.MeshStandardMaterial({ color: 0xeae6df }));
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // ถนน
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x8b7355 });
            const roads = [
                { w: 65, d: 4, x: 0, z: 16 }, // ถ.ติวานนท์
                { w: 35, d: 2, x: 2, z: 12.5 }, // หน้าตึกเฉลิมพระเกียรติ
                { w: 2, d: 20, x: -13, z: 3.5 },
                { w: 28, d: 2, x: 0, z: -7.5 },
                { w: 2, d: 28, x: 13, z: 0 },
                { w: 45, d: 2, x: -9.5, z: -14 },
                { w: 10, d: 2, x: 15, z: -7.5 },
                { w: 10, d: 2, x: 22.5, z: 4.5 } 
            ];
            roads.forEach(r => {
                const road = new THREE.Mesh(new THREE.PlaneGeometry(r.w, r.d), roadMat);
                road.rotation.x = -Math.PI / 2;
                road.position.set(r.x, 0.02, r.z);
                road.receiveShadow = true;
                scene.add(road);
            });

            // คลองระบายน้ำสีฟ้า
            const canal = new THREE.Mesh(new THREE.PlaneGeometry(50, 1.5), new THREE.MeshStandardMaterial({ color: 0x0ea5e9 }));
            canal.rotation.x = -Math.PI / 2;
            canal.position.set(5, 0.03, -13.5);
            scene.add(canal);

            // ป้ายประตู
            createGateLabel("ประตู 2", -13, 16);
            createGateLabel("ประตู 1", 3, 16);
            createGateLabel("ทางออก ถ.ติวานนท์", 24, 16);
        }

        function createTrafficArrows() {
            const arrowMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            function addArrow(x, z, rot) {
                const shape = new THREE.Shape();
                shape.moveTo(0, 0.8);
                shape.lineTo(0.6, 0); shape.lineTo(0.2, 0); shape.lineTo(0.2, -0.8);
                shape.lineTo(-0.2, -0.8); shape.lineTo(-0.2, 0); shape.lineTo(-0.6, 0);
                shape.lineTo(0, 0.8);
                
                const arrow = new THREE.Mesh(new THREE.ShapeGeometry(shape), arrowMat);
                arrow.rotation.x = -Math.PI / 2;
                arrow.rotation.z = rot;
                arrow.position.set(x, 0.05, z);
                arrow.scale.set(0.7, 0.7, 0.7);
                scene.add(arrow);
            }
            addArrow(-13, 14, 0);
            addArrow(-13, 7, 0); 
            addArrow(3, 14, 0); 
            addArrow(0, 12.5, Math.PI/2);
            addArrow(13, 4, Math.PI);
            addArrow(13, -2, Math.PI);
            addArrow(24, 14.5, -Math.PI/2);
        }

        // สร้างอาคารสีขาวขอบดำ มีชั้น
        function createWhiteBuilding(data) {
            const group = new THREE.Group();
            
            const floorHeight = 1.0;
            const floorCount = Math.max(1, Math.floor(data.h / floorHeight));
            const bColor = data.isBlue ? 0x38bdf8 : 0xffffff;
            
            const baseMat = new THREE.MeshStandardMaterial({ color: bColor, roughness: 0.9 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.8 }); 

            for (let i = 0; i < floorCount; i++) {
                const yPos = (i * floorHeight);
                // พื้น
                const slab = new THREE.Mesh(new THREE.BoxGeometry(data.w, 0.1, data.d), baseMat);
                slab.position.y = yPos;
                addBlackEdges(slab); 
                group.add(slab);

                // กำแพง
                const wall = new THREE.Mesh(new THREE.BoxGeometry(data.w * 0.95, floorHeight - 0.1, data.d * 0.95), baseMat);
                wall.position.y = yPos + (floorHeight/2);
                addBlackEdges(wall); 
                group.add(wall);

                // กระจกหน้าต่าง
                if (!data.isBlue) {
                    const winZ = new THREE.Mesh(new THREE.BoxGeometry(data.w * 0.8, floorHeight * 0.6, data.d * 0.97), glassMat);
                    winZ.position.y = yPos + (floorHeight/2);
                    group.add(winZ);

                    const winX = new THREE.Mesh(new THREE.BoxGeometry(data.w * 0.97, floorHeight * 0.6, data.d * 0.8), glassMat);
                    winX.position.y = yPos + (floorHeight/2);
                    group.add(winX);
                }
            }

            // หลังคา
            const roof = new THREE.Mesh(new THREE.BoxGeometry(data.w, 0.1, data.d), baseMat);
            roof.position.y = floorCount * floorHeight;
            addBlackEdges(roof); 
            group.add(roof);

            const hitbox = new THREE.Mesh(new THREE.BoxGeometry(data.w + 0.2, data.h, data.d + 0.2), new THREE.MeshBasicMaterial({ visible: false }));
            hitbox.position.y = data.h / 2;
            hitbox.userData = data;
            group.add(hitbox);
            interactableObjects.push(hitbox);

            group.position.set(data.x, 0, data.z);
            scene.add(group);

            createLabelObject(data.name, group.position, data.h + 1.2);
        }

        function createEnvironment() {
            // สนามเทนนิส
            const tennisCourt = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 4), new THREE.MeshStandardMaterial({ color: 0x22c55e }));
            tennisCourt.position.set(15.5, 0.05, 9);
            const courtBorder = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.08, 4.2), new THREE.MeshStandardMaterial({ color: 0xdc2626 }));
            courtBorder.position.set(15.5, 0.04, 9);
            scene.add(tennisCourt); scene.add(courtBorder);

            // ต้นไม้จำลอง
            const treeMat = new THREE.MeshStandardMaterial({ color: 0x15803d });
            const tGeo = new THREE.DodecahedronGeometry(0.8, 1);
            
            const treePositionsArray = [
                [-13, 7], [-13, 9], [-5, 12], [1, 12], [3, 12], [6, 12],
                [-8, 6], [-6, 6], [-1, 6], [1, 6], [7, 6],
                [-18, -8], [-20, -8], [11, 4], [13, 4], [18, 12], [23, 10], [27, 4], [25, 0], [24, -4],
                [-11, 14], [-4, 14], [9, 14], [1, 5], [-5, 5], [13, 6], [19, 13], [24, 7], [22, -2], [-19, -8], [-12, -12]
            ];
            
            treePositionsArray.forEach(pos => {
                const t = new THREE.Mesh(tGeo, treeMat);
                t.position.set(pos[0], 0.8, pos[1]);
                t.castShadow = true;
                scene.add(t);
            });
        }

        function createLabelObject(text, position, heightOffset) {
            const div = document.createElement('div');
            div.className = 'building-label';
            div.innerText = text;
            const labelObj = new CSS2DObject(div);
            labelObj.position.set(position.x, heightOffset, position.z);
            scene.add(labelObj);
        }

        function createGateLabel(text, x, z) {
            const div = document.createElement('div');
            div.className = 'gate-label';
            div.innerText = text;
            const labelObj = new CSS2DObject(div);
            labelObj.position.set(x, 1, z);
            scene.add(labelObj);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactableObjects);

            if (intersects.length > 0) {
                const selected = intersects[0].object;
                
                document.getElementById('cardTitle').innerText = selected.userData.name;
                document.getElementById('cardDesc').innerText = selected.userData.desc;
                document.getElementById('infoCard').classList.add('active');
                
                let targetPos = new THREE.Vector3();
                selected.getWorldPosition(targetPos);
                targetPos.y = 0;
                controls.target.copy(targetPos);
            } else {
                document.getElementById('infoCard').classList.remove('active');
            }
        }

        window.closeCard = function() {
            document.getElementById('infoCard').classList.remove('active');
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
