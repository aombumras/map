<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Realistic Sci-Fi 3D Campus Map</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0d1117; } /* พื้นหลังเข้มแบบอวกาศ/กลางคืน */
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* ป้ายชื่อตึกแนว Sci-Fi Hologram โปร่งใส */
        .building-label {
            background: rgba(0, 20, 40, 0.5); /* โปร่งใส */
            color: #00ffff; /* ตัวหนังสือสีฟ้าเรืองแสง */
            padding: 8px 16px;
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.2);
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            white-space: nowrap;
            backdrop-filter: blur(5px); /* เอฟเฟกต์กระจกฝ้า */
            background-image: linear-gradient(0deg, transparent 50%, rgba(0, 255, 255, 0.05) 50%);
            background-size: 100% 4px; /* เส้นสแกนแบบโฮโลแกรม */
        }
        .building-label::before {
            content: ''; position: absolute; bottom: -15px; left: 50%; width: 1px; height: 15px;
            background: rgba(0, 255, 255, 0.5); transform: translateX(-50%);
        }
        .building-label:hover {
            background: rgba(0, 50, 80, 0.7); box-shadow: 0 0 25px rgba(0, 255, 255, 0.6); transform: scale(1.1);
        }

        /* UI คอนโทรล */
        .ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px;
        }

        .header-panel {
            background: rgba(10, 15, 25, 0.7); border: 1px solid #00ffff;
            padding: 12px 20px; border-radius: 8px; box-shadow: 0 0 20px rgba(0,255,255,0.2);
            pointer-events: auto; backdrop-filter: blur(10px); max-width: 350px; color: white;
        }
        .header-panel h1 { font-size: 18px; color: #00ffff; margin-bottom: 4px; font-family: 'Courier New', Courier, monospace; }
        .header-panel p { font-size: 12px; color: #aaa; }

        /* กล่องข้อมูล (Info Card) แบบ Sci-Fi */
        .info-card {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(50px);
            background: rgba(10, 15, 25, 0.85); border: 1px solid #00ffff; border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,255,255,0.3); z-index: 20; width: 90%; max-width: 340px;
            opacity: 0; pointer-events: none; transition: all 0.4s ease; backdrop-filter: blur(10px);
        }
        .info-card.active { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        
        .card-content { padding: 20px; }
        .card-content h3 { font-size: 20px; color: #00ffff; margin-bottom: 10px; border-bottom: 1px solid rgba(0,255,255,0.3); padding-bottom: 5px; }
        .card-content p { font-size: 14px; color: #ddd; line-height: 1.5; margin-bottom: 20px; }
        
        .close-btn {
            background: transparent; color: #00ffff; border: 1px solid #00ffff; width: 100%;
            padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .close-btn:hover { background: rgba(0, 255, 255, 0.2); }

    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="header-panel">
            <h1>SYSTEM:// MAP_ONLINE</h1>
            <p>ลากนิ้วเพื่อหมุน 360° | แตะที่ป้ายโฮโลแกรมเพื่อดูข้อมูลอาคาร</p>
        </div>
    </div>

    <!-- กล่องข้อความแสดงผล (Info Card) -->
    <div class="info-card" id="infoCard">
        <div class="card-content">
            <h3 id="cardTitle">BUILDING_NAME</h3>
            <p id="cardDesc">Loading data...</p>
            <button class="close-btn" onclick="closeCard()">[ X ] CLOSE PANEL</button>
        </div>
    </div>

    <!-- โหลด Three.js และไลบรารี -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>
        let scene, camera, renderer, labelRenderer, controls;
        let buildingHitboxes = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // ข้อมูลสถานที่
        const buildingData = [
            { id: 1, name: "ECC BUILDING", desc: "อาคารเรียนรวมและศูนย์ปฏิบัติการวิศวกรรม โครงสร้างหลักทำจากกระจกและเหล็ก", color: 0x8899a6, x: -3, z: -1.5, w: 2.5, h: 3.5, d: 2 },
            { id: 2, name: "KMUIDS INST.", desc: "สถาบันการศึกษานานาชาติ พื้นที่นวัตกรรมและแหล่งเรียนรู้ระดับสากล", color: 0xaaaaaa, x: 2, z: -4.5, w: 3, h: 2, d: 2.5 },
            { id: 3, name: "MEDICAL FACULTY", desc: "อาคารคณะแพทยศาสตร์และโรงพยาบาลเพื่อการวิจัย", color: 0xcdd6df, x: -1.5, z: -5.5, w: 2.5, h: 2.5, d: 2 },
            { id: 4, name: "RECTOR'S OFFICE", desc: "ศูนย์กลางการบริหารงานของมหาวิทยาลัย ศูนย์สั่งการหลัก", color: 0x999999, x: 5, z: -3.5, w: 2.5, h: 2.8, d: 2 },
            { id: 5, name: "CANTEEN B", desc: "ศูนย์อาหารและเสบียงสำหรับนักศึกษา", color: 0xbbbbbb, x: -3.5, z: 4.5, w: 2.2, h: 1.5, d: 2 },
            { id: 6, name: "DORMITORY", desc: "โซนที่พักอาศัยของนักศึกษา", color: 0xa0aab5, x: -7, z: -1, w: 2.5, h: 4.5, d: 3 },
            { id: 7, name: "TRANSIT STATION", desc: "สถานีรถไฟขนส่งมวลชน เชื่อมต่อภายนอกแคมปัส", color: 0x666666, x: 0, z: 2.5, w: 8, h: 0.8, d: 1.2 }
        ];

        function init() {
            const container = document.getElementById('canvas-container');
            
            // 1. Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0d1117, 0.02); // หมอกบางๆ แนว Sci-Fi
            
            // 2. Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 16, 18);

            // 3. WebGL Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. CSS2D Renderer (ป้ายโฮโลแกรม)
            labelRenderer = new THREE.CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none'; 
            document.body.appendChild(labelRenderer.domElement);

            // 5. Controls (หมุนสมูท)
            controls = new THREE.OrbitControls(camera, labelRenderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.1; 
            controls.minDistance = 5;
            controls.maxDistance = 40;

            // 6. แสงไฟ (สมจริง + แนวไซไฟ)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
            dirLight.position.set(15, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // แสงไฟสีฟ้าสร้างบรรยากาศ (Sci-Fi Ambient)
            const blueLight = new THREE.PointLight(0x00ffff, 0.5, 50);
            blueLight.position.set(0, 5, 0);
            scene.add(blueLight);

            // 7. สร้างพื้นและทางเดิน
            createEnvironment();

            // 8. สร้างอาคารเสมือนจริงและป้าย
            buildingData.forEach(data => createRealisticBuilding(data));

            // Events
            window.addEventListener('resize', onWindowResize);
            labelRenderer.domElement.addEventListener('pointerdown', onDocumentClick);

            animate();
        }

        function createEnvironment() {
            // พื้นหลัก (สีทึบสไตล์คอนกรีต/ไซไฟ)
            const groundGeo = new THREE.PlaneGeometry(35, 35);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a202c, roughness: 0.9, metalness: 0.1 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // สร้างเครือข่ายเส้นทางเดิน (Walkways) เชื่อมต่อตึก
            const pathMat = new THREE.MeshStandardMaterial({ color: 0x3a4a5a, roughness: 0.6 }); // สีทางเดินสว่างกว่าพื้น
            
            const paths = [
                { x: 0, z: -1, w: 20, h: 1.5 }, // เส้นนอนหลักกลาง
                { x: 0, z: -4.5, w: 15, h: 1.2 }, // เส้นนอนบน
                { x: -3, z: 1.5, w: 1.5, h: 8 }, // เส้นตั้งซ้าย
                { x: 2, z: -2.5, w: 1.5, h: 4 }, // เส้นตั้งกลาง
                { x: 5, z: -1, w: 1.5, h: 6 }, // เส้นตั้งขวา
                { x: -7, z: -1, w: 6, h: 1.5 } // ทางเชื่อมไปหอพัก
            ];

            paths.forEach(p => {
                const pathGeo = new THREE.PlaneGeometry(p.w, p.h);
                const pathMesh = new THREE.Mesh(pathGeo, pathMat);
                pathMesh.rotation.x = -Math.PI / 2;
                pathMesh.position.set(p.x, 0.02, p.z); // ลอยเหนือพื้นนิดนึง
                pathMesh.receiveShadow = true;
                scene.add(pathMesh);
            });
        }

        function createRealisticBuilding(data) {
            const group = new THREE.Group();
            
            // วัสดุหลักของตึก (คอนกรีต/โลหะ)
            const coreGeo = new THREE.BoxGeometry(data.w * 0.9, data.h, data.d * 0.9);
            const coreMat = new THREE.MeshStandardMaterial({ 
                color: data.color, 
                roughness: 0.7,
                metalness: 0.3 
            });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            coreMesh.position.y = data.h / 2;
            coreMesh.castShadow = true;
            coreMesh.receiveShadow = true;
            group.add(coreMesh);

            // เปลือกตึกจำลองเป็นกระจกสมจริง (Realistic Glass facade)
            const glassGeo = new THREE.BoxGeometry(data.w, data.h * 0.9, data.d);
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0x88ccff,
                metalness: 0.9,
                roughness: 0.1,
                transmission: 0.7, // ทำให้ทะลุเหมือนกระจก
                transparent: true,
                opacity: 0.7
            });
            const glassMesh = new THREE.Mesh(glassGeo, glassMat);
            glassMesh.position.y = data.h / 2;
            group.add(glassMesh);

            // กล่องดักจับการคลิก (Invisible Hitbox)
            const hitBoxGeo = new THREE.BoxGeometry(data.w, data.h, data.d);
            const hitBoxMat = new THREE.MeshBasicMaterial({ visible: false });
            const hitBox = new THREE.Mesh(hitBoxGeo, hitBoxMat);
            hitBox.position.y = data.h / 2;
            hitBox.userData = data;
            group.add(hitBox);
            buildingHitboxes.push(hitBox);

            group.position.set(data.x, 0, data.z);
            scene.add(group);

            // สร้างป้ายชื่อ Hologram HTML
            const labelDiv = document.createElement('div');
            labelDiv.className = 'building-label';
            labelDiv.textContent = data.name;
            labelDiv.style.pointerEvents = 'auto'; 
            labelDiv.onclick = () => showCard(data);

            const labelObj = new THREE.CSS2DObject(labelDiv);
            labelObj.position.set(0, data.h + 1.2, 0); // ลอยเหนือตึก
            group.add(labelObj);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(buildingHitboxes);

            if (intersects.length > 0) {
                const selected = intersects[0].object;
                showCard(selected.userData);
                
                // หันกล้องไปจุดที่กด
                controls.target.copy(selected.parent.position);
            }
        }

        function showCard(data) {
            document.getElementById('cardTitle').innerText = data.name;
            document.getElementById('cardDesc').innerText = data.desc;
            document.getElementById('infoCard').classList.add('active');
        }

        function closeCard() {
            document.getElementById('infoCard').classList.remove('active');
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // อัปเดตการหมุนให้สมูท
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
